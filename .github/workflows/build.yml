name: Test and build Word Template Filler

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test application and template engine
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip lxml openpyxl pytest python-docx

      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          python -c "from version import APP_VERSION; import sys; assert APP_VERSION == sys.argv[1], f'Git tag {sys.argv[1]} does not match APP_VERSION {APP_VERSION}'" "$TAG_VERSION"

      - name: Run tests
        run: python -m pytest -q tests

  build-windows:
    name: Build Windows x64
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build Windows application
        shell: pwsh
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\build-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $built = Get-ChildItem "dist" -Filter "Word Template Filler *.exe" | Select-Object -First 1
          if (-not $built) { throw "Windows executable was not produced." }
          $releaseAsset = "dist/Word-Template-Filler-windows-x64.exe"
          Move-Item -LiteralPath $built.FullName -Destination $releaseAsset
          if ((Get-Item -LiteralPath $releaseAsset).Length -le 0) {
            throw "Windows executable is empty."
          }
          Get-FileHash -Algorithm SHA256 -LiteralPath $releaseAsset

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: build-windows-x64
          path: dist/Word-Template-Filler-windows-x64.exe
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build ${{ matrix.label }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel
            os: macos-26-intel
            target: macos-intel
          - label: macOS Apple Silicon
            os: macos-26
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller lxml

      - name: Build macOS application
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name "Word Template Filler" --add-data "USER-GUIDE.txt:." simple_app.py
          ditto -c -k --sequesterRsrc --keepParent "dist/Word Template Filler.app" "dist/Word-Template-Filler-${{ matrix.target }}.zip"

      - name: Upload macOS application
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: dist/Word-Template-Filler-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    # Windows is the required release asset. macOS builds are attached when
    # available, but a failed or cancelled macOS runner must not suppress the
    # Windows executable or prevent the release from being published.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.test.result == 'success' && needs.build-windows.result == 'success' }}
    needs:
      - test
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download available platform builds
        uses: actions/download-artifact@v7
        with:
          pattern: build-*
          path: release-assets
          merge-multiple: true

      - name: Verify required Windows release asset
        run: |
          test -s release-assets/Word-Template-Filler-windows-x64.exe
          echo "Required Windows executable is present."
          echo "macOS build matrix result: ${{ needs.build-macos.result }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub release and attach applications
        uses: softprops/action-gh-release@v2
        with:
          name: Word Template Filler ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
