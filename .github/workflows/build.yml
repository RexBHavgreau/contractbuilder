name: Test and build Contract Builder

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # Weekly: build tools that are not pinned can grow the executable without
  # any commit (T-035).
  schedule:
    - cron: "17 6 * * 1"

# A newer push to the same pull request replaces the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  version:
    name: Read application version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag_exists: ${{ steps.read.outputs.tag_exists }}
    steps:
      - name: Check out source with tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read APP_VERSION and look for its tag
        id: read
        run: |
          VERSION=$(python3 -c "from version import APP_VERSION; print(APP_VERSION)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "APP_VERSION $VERSION" >> "$GITHUB_STEP_SUMMARY"

  scope:
    name: Decide which builds are needed
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.scope.outputs.windows }}
      macos: ${{ steps.scope.outputs.macos }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pushes to main, tags, the weekly run and manual runs build everything.
      # A pull request builds only what its changed files could affect.
      - name: Choose builds
        id: scope
        run: |
          python3 scripts/ci_scope.py --event "${{ github.event_name }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" | tee -a "$GITHUB_OUTPUT"

  test:
    name: Test application and template engine
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip lxml openpyxl pytest python-docx markdown-it-py==3.0.0 mdurl==0.1.2

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth

      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          python -c "from version import APP_VERSION; import sys; assert APP_VERSION == sys.argv[1], f'Git tag {sys.argv[1]} does not match APP_VERSION {APP_VERSION}'" "$TAG_VERSION"

      - name: Run tests
        env:
          # Terms from real contracts that must never be committed (the
          # repository is public). Kept as a secret so the list stays private;
          # tests/test_no_private_details.py reads it and skips without it.
          BLOCKED_TERMS: ${{ secrets.BLOCKED_TERMS }}
        run: python -m pytest -q tests

      - name: Warn about open tasks that share a file
        # Warning only (T-055): claimed tasks that overlap show here and the run stays green.
        continue-on-error: true
        run: python scripts/overlaps.py

      - name: Exercise Tk windows under a virtual display
        run: xvfb-run -a python -m pytest -q tests/test_window_smoke.py

  build-windows:
    name: Build Windows x64
    needs: [test, scope]
    if: needs.scope.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # Use Windows PowerShell 5.1, matching build-windows.bat, so syntax
      # errors are caught before the build starts.
      - name: Validate Windows build scripts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $scriptPath = Join-Path $env:GITHUB_WORKSPACE "build-windows.ps1"
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null

          if ($parseErrors.Count -gt 0) {
            foreach ($parseError in $parseErrors) {
              Write-Error ("{0} (line {1}, column {2})" -f
                $parseError.Message,
                $parseError.Extent.StartLineNumber,
                $parseError.Extent.StartColumnNumber)
            }
            throw "build-windows.ps1 has PowerShell syntax errors."
          }
          Write-Host "build-windows.ps1 parses successfully in Windows PowerShell 5.1."

          # Check the bytes, not a decoded string: Git can otherwise hide
          # mixed LF/CRLF endings during text handling.
          $batchPath = Join-Path $env:GITHUB_WORKSPACE "build-windows.bat"
          $bytes = [System.IO.File]::ReadAllBytes($batchPath)
          if ($bytes.Length -eq 0) {
            throw "build-windows.bat is empty."
          }

          $lineBreakCount = 0
          for ($i = 0; $i -lt $bytes.Length; $i++) {
            if ($bytes[$i] -eq 10) {
              $lineBreakCount++
              if ($i -eq 0 -or $bytes[$i - 1] -ne 13) {
                throw "build-windows.bat contains an LF line ending without a preceding CR."
              }
            }
            if ($bytes[$i] -eq 13) {
              if ($i + 1 -ge $bytes.Length -or $bytes[$i + 1] -ne 10) {
                throw "build-windows.bat contains a CR not followed by LF."
              }
            }
          }
          if ($lineBreakCount -eq 0) {
            throw "build-windows.bat has no CRLF line endings."
          }
          Write-Host "build-windows.bat uses CRLF line endings."

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build Windows application
        shell: pwsh
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\build-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $built = Get-ChildItem "dist" -Filter "Contract Builder *.exe" | Select-Object -First 1
          if (-not $built) { throw "Windows executable was not produced." }
          $versionLine = Select-String -Path "version.py" -Pattern '^APP_VERSION\s*=\s*"([^"]+)"'
          if (-not $versionLine) { throw "Could not read APP_VERSION from version.py." }
          $version = $versionLine.Matches[0].Groups[1].Value
          $releaseAsset = "dist/ContractBuilder-$version-windows-x64.exe"
          Move-Item -LiteralPath $built.FullName -Destination $releaseAsset
          if ((Get-Item -LiteralPath $releaseAsset).Length -le 0) {
            throw "Windows executable is empty."
          }
          # Published under the fixed name too: copies of 0.4.x look only for it.
          Copy-Item -LiteralPath $releaseAsset -Destination "dist/Word-Template-Filler-windows-x64.exe"
          "WINDOWS_RELEASE_ASSET=$releaseAsset" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-FileHash -Algorithm SHA256 -LiteralPath $releaseAsset

      - name: Check Windows executable size
        shell: pwsh
        run: |
          python scripts/check_executable_size.py $env:WINDOWS_RELEASE_ASSET --min-headroom 3145728
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Compare the release build with the same application while forcing in
      # the Markdown-to-Word component stack. This makes PyInstaller include
      # modules not imported by simple_app.py yet, so the size check measures
      # their actual bundled cost instead of silently omitting them.
      - name: Measure component-builder executable size
        shell: pwsh
        run: |
          $releaseAsset = $env:WINDOWS_RELEASE_ASSET
          if (-not (Test-Path -LiteralPath $releaseAsset)) {
            throw "The normal Windows executable is missing."
          }
          $withoutBytes = (Get-Item -LiteralPath $releaseAsset).Length

          $versionLine = Select-String -Path "version.py" -Pattern '^APP_VERSION\s*=\s*"([^"]+)"'
          if (-not $versionLine) { throw "Could not read APP_VERSION from version.py." }
          $appName = "Contract Builder $($versionLine.Matches[0].Groups[1].Value)"

          $probeRoot = Join-Path $env:RUNNER_TEMP "component-builder-size"
          $probeDist = Join-Path $probeRoot "dist"
          $probeWork = Join-Path $probeRoot "work"
          New-Item -ItemType Directory -Force -Path $probeRoot, $probeDist, $probeWork | Out-Null

          $arguments = @(
            "-m", "PyInstaller", "--clean", "--noconfirm", "--onefile", "--windowed",
            "--name", $appName,
            "--distpath", $probeDist,
            "--workpath", $probeWork,
            "--specpath", $probeRoot,
            "--add-data", ((Join-Path $env:GITHUB_WORKSPACE "USER-GUIDE.txt") + ";."),
            "--add-data", ((Join-Path $env:GITHUB_WORKSPACE "THIRD-PARTY-LICENSES.txt") + ";."),
            "simple_app.py"
          )
          # Force in every application module (scripts/list_app_modules.py),
          # so a new module is measured without anyone editing this list.
          $hidden = @()
          foreach ($module in (python scripts/list_app_modules.py)) {
            $hidden += @("--hidden-import", $module.Trim())
          }
          $arguments = $arguments[0..($arguments.Count - 2)] + $hidden + @("simple_app.py")
          python @arguments
          if ($LASTEXITCODE -ne 0) { throw "The component-builder measurement build failed." }

          $probeExe = Join-Path $probeDist "$appName.exe"
          if (-not (Test-Path -LiteralPath $probeExe)) {
            throw "PyInstaller did not produce the component-builder measurement executable."
          }
          $withBytes = (Get-Item -LiteralPath $probeExe).Length
          $deltaBytes = $withBytes - $withoutBytes
          $mib = 1MB

          Write-Host ("Release build:                {0:N0} bytes ({1:N2} MiB)" -f $withoutBytes, ($withoutBytes / $mib))
          Write-Host ("With all modules forced in:   {0:N0} bytes ({1:N2} MiB)" -f $withBytes, ($withBytes / $mib))
          Write-Host ("Added bundled size:           {0:N0} bytes ({1:N2} MiB)" -f $deltaBytes, ($deltaBytes / $mib))

          # Growth since the last published release (best effort).
          $previous = 0
          try {
            $env:GH_TOKEN = "${{ github.token }}"
            $json = gh api "repos/${{ github.repository }}/releases/latest" | ConvertFrom-Json
            $asset = $json.assets | Where-Object { $_.name -eq "Word-Template-Filler-windows-x64.exe" -or $_.name -like "ContractBuilder-*-windows-x64.exe" } | Select-Object -First 1
            if ($asset) { $previous = [int64]$asset.size }
          } catch { Write-Host "No earlier release size available." }

          python scripts/size_report.py $releaseAsset $probeExe --previous $previous | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $tools = python -c "import sys, importlib.metadata as m; print('Python', sys.version.split()[0], '| PyInstaller', m.version('pyinstaller'), '| lxml', m.version('lxml'))"
          "Build tools: $tools" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          python scripts/check_executable_size.py $probeExe --min-headroom 3145728
          if ($LASTEXITCODE -ne 0) { throw "The component-builder executable exceeds the 30 MiB release limit." }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: build-windows-x64
          path: |
            dist/ContractBuilder-*-windows-x64.exe
            dist/Word-Template-Filler-windows-x64.exe
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build ${{ matrix.label }}
    needs: [test, scope]
    if: needs.scope.outputs.macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel
            os: macos-26-intel
            target: macos-intel
          - label: macOS Apple Silicon
            os: macos-26
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller lxml markdown-it-py==3.0.0 mdurl==0.1.2

      - name: Build macOS application
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name "Contract Builder" --add-data "USER-GUIDE.txt:." --add-data "THIRD-PARTY-LICENSES.txt:." simple_app.py
          ditto -c -k --sequesterRsrc --keepParent "dist/Contract Builder.app" "dist/Word-Template-Filler-${{ matrix.target }}.zip"

      - name: Upload macOS application
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: dist/Word-Template-Filler-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    # A release is published either when a v* tag is pushed, or when main
    # receives a version.py whose APP_VERSION has no tag yet: raising the
    # version number is all a release needs, so a tag can never disagree
    # with the version inside the app.
    #
    # Windows is the required release asset. macOS builds are attached when
    # available, but a failed or cancelled macOS runner must not suppress the
    # Windows executable or prevent the release from being published.
    if: >-
      ${{ always()
          && needs.test.result == 'success'
          && needs.build-windows.result == 'success'
          && (startsWith(github.ref, 'refs/tags/v')
              || (github.event_name == 'push' && github.ref == 'refs/heads/main'
                  && needs.version.outputs.tag_exists == 'false')) }}
    needs:
      - version
      - test
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v7

      - name: Extract release notes for this version
        run: python scripts/extract_release_notes.py "${{ needs.version.outputs.version }}" CHANGES.txt release-notes.txt

      - name: Download available platform builds
        uses: actions/download-artifact@v7
        with:
          pattern: build-*
          path: release-assets
          merge-multiple: true

      - name: Verify required Windows release asset
        run: |
          test -s release-assets/Word-Template-Filler-windows-x64.exe
          test -s release-assets/ContractBuilder-*-windows-x64.exe
          echo "Required Windows executables are present (versioned and fixed name)."
          echo "macOS build matrix result: ${{ needs.build-macos.result }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub release and attach applications
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Contract Builder v${{ needs.version.outputs.version }}
          body_path: release-notes.txt
          files: release-assets/*
          fail_on_unmatched_files: true
